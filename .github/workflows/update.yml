name: Update README

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:     # manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node update-readme.js

      - name: Set up authenticated git remote
        run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/shreya-0718/shreya-0718.git
      
      - name: Commit and push changes
        run: |
          git config --global user.name "shreya-0718"
          git config --global user.email "shreyachougule796@gmail.com"
          git add README.md
          git diff --quiet || git commit -m "✨ update readme stats"
          git push